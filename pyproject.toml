[project]
name = "sequential-markov-testing-reproduction"
version = "0.1.0"
description = "CPU reproduction of Asymptotically Optimal Sequential Testing with Markovian Data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cvxpy==1.7.2",
    "gymnasium[classic-control]==1.2.1",
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "scipy==1.16.2",
]

[dependency-groups]
dev = [
    "marimo==0.16.2",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]
